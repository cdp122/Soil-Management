<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../src/styles/RecoverPass.css">
    <title>Recuperación de Contraseña</title>
</head>
<body>

    <div class="container">
        <div class="card">
            <div class="header">
                <div class="title">
                    <span class="icon">ℹ️</span>
                    <h2>Recuperación de Contraseña</h2>
                </div>
                <button class="close-btn">&times;</button>
            </div>
            <p class="subtitle">Coloque su palabra clave para recuperar cuenta</p>
            <div class="input-container">
                <input type="text" class="input-field" placeholder="" />
                <button class="check-btn">✔️</button>
            </div>
            <div class="actions">
                <button class="cancel-btn">Cancelar</button>
                <button class="accept-btn">Aceptar</button>
            </div>
        </div>
    </div>

</body>
</html>
